
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Cómo está el tiempo en tu escuela?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAF3FB;
    --card:#FFFFFF;
    --ink:#0F2A47;
    --muted:#5B7089;
    --border:#D6E4F0;
    --blue:#3E8FD0;
    --blue-dark:#1B5A8C;
    --blue-tint:#E1EFFA;
    --gold:#F0B93E;
    --gold-dark:#8A5E10;
    --gold-tint:#FCEFCB;
    --green:#4C8062;
    --green-tint:#E7F1EA;
    --navy-tint:#E4E8F0;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:0 0 80px;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px;}
  header.banner{
    background:linear-gradient(155deg,var(--blue) 0%,var(--blue-dark) 100%);
    padding:26px 24px;
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:30px;
  }
  header.banner img{
    width:64px;height:64px;
    border-radius:12px;
    flex-shrink:0;
    display:block;
  }
  header.banner h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:24px;
    line-height:1.25;
    margin:0;
    color:#fff;
  }
  header.banner h1 .accent{color:var(--gold);}
  .credit-line{
    font-size:12px;
    color:var(--muted);
    margin:14px 0 8px;
    line-height:1.5;
  }
  .section-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:19px;
    color:var(--blue-dark);
    margin:36px 0 14px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .section-sub{
    font-size:13px;
    color:var(--muted);
    margin:-10px 0 16px;
    max-width:560px;
  }
  .schools-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:16px;
  }
  .school-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px 18px 14px;
  }
  .school-head{
    display:flex;
    gap:14px;
    align-items:center;
    margin-bottom:12px;
  }
  .school-info{flex:1;min-width:0;}
  .school-name{
    font-weight:600;
    font-size:14.5px;
    line-height:1.3;
    margin:0 0 3px;
  }
  .school-loc{
    font-size:12.5px;
    color:var(--muted);
    margin:0;
  }
  .stage{
    border-top:1px solid var(--border);
    padding:10px 0;
  }
  .stage:first-of-type{margin-top:4px;}
  .stage-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    gap:8px;
    user-select:none;
  }
  .stage-head-left{
    display:flex;
    align-items:center;
    gap:9px;
    min-width:0;
  }
  .stage-dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--border);
    flex-shrink:0;
  }
  .stage-dot.done{background:var(--green);}
  .stage-dot.partial{background:var(--gold);}
  .stage-title{
    font-size:13.5px;
    font-weight:500;
  }
  .stage-frac{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--muted);
    flex-shrink:0;
  }
  .chev{
    transition:transform .15s ease;
    color:var(--muted);
    font-size:11px;
    flex-shrink:0;
  }
  .chev.open{transform:rotate(90deg);}
  .stage-body{
    display:none;
    padding:10px 0 2px 18px;
  }
  .stage-body.open{display:block;}
  .task-row{
    display:flex;
    align-items:flex-start;
    gap:9px;
    padding:6px 0;
    font-size:13.5px;
    flex-wrap:wrap;
  }
  .task-row input[type=checkbox]{
    margin-top:3px;
    width:15px;height:15px;
    accent-color:var(--green);
    flex-shrink:0;
    cursor:pointer;
  }
  .task-main{
    flex:1;
    min-width:160px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .task-row label{
    cursor:pointer;
    line-height:1.4;
  }
  .task-row.done label{
    color:var(--muted);
    text-decoration:line-through;
  }

  .task-meta-row{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }
  .attach-toggle{
    background:none;border:none;color:var(--muted);
    font-size:11px;cursor:pointer;padding:2px 6px;
    text-decoration:underline;
  }
  .attach-toggle:hover{color:var(--blue-dark);}
  .task-actions{
    display:flex;align-items:center;gap:4px;
    margin-left:auto;
  }
  .task-del{
    background:none;border:none;color:var(--muted);
    cursor:pointer;font-size:14px;padding:0 2px;
    line-height:1;opacity:.5;
  }
  .task-del:hover{opacity:1;color:#a3402f;}
  .attach-block{
    margin-top:4px;
    padding:8px 10px;
    background:#fbfbf9;
    border:1px solid var(--border);
    border-radius:9px;
    width:100%;
  }
  .attach-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
  .attach-chip{
    display:flex;align-items:center;gap:5px;
    background:var(--blue-tint);color:var(--blue-dark);
    font-size:11.5px;font-weight:500;
    padding:3px 8px;border-radius:14px;
    text-decoration:none;
  }
  .attach-chip button{
    background:none;border:none;color:var(--blue-dark);
    cursor:pointer;font-size:11px;padding:0;opacity:.6;
  }
  .attach-form{display:flex;gap:5px;flex-wrap:wrap;}
  .attach-form input{
    font-family:'Inter',sans-serif;
    font-size:12px;
    padding:5px 8px;
    border:1px solid var(--border);
    border-radius:7px;
    background:#fff;
  }
  .attach-form input.link{flex:1;min-width:120px;}
  .attach-form input.name{width:130px;}
  .attach-form button{
    font-family:'Inter',sans-serif;
    font-size:12px;font-weight:500;
    padding:5px 10px;
    border:1px solid var(--blue);
    background:var(--blue);color:#fff;
    border-radius:7px;cursor:pointer;
  }
  .add-row{
    display:flex;gap:6px;margin-top:8px;
  }
  .add-row input{
    flex:1;
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:6px 9px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#fbfbf9;
  }
  .add-row input:focus{outline:2px solid var(--blue-tint);border-color:var(--blue);}
  .add-row button{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    padding:6px 12px;
    border:1px solid var(--blue);
    background:var(--blue);
    color:#fff;
    border-radius:8px;
    cursor:pointer;
  }
  .add-row button:hover{background:var(--blue-dark);}
  .gauge{flex-shrink:0;}
  .install-panel{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px 20px;
  }
  .install-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-top:1px solid var(--border);
    flex-wrap:wrap;
  }
  .install-row:first-child{border-top:none;}
  .install-name{
    flex:1;min-width:180px;
    font-size:13.5px;font-weight:500;
  }
  .install-name span{
    display:block;font-weight:400;font-size:12px;color:var(--muted);
  }
  .install-check{
    display:flex;align-items:center;gap:6px;
    font-size:12.5px;color:var(--muted);
    background:var(--bg);
    padding:5px 10px;
    border-radius:20px;
  }
  .install-check.done{background:var(--green-tint);color:var(--green);}
  .install-check input{accent-color:var(--green);cursor:pointer;}
  .resources-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:16px;
  }
  .res-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px 18px;
  }
  .res-title{
    font-weight:600;
    font-size:14px;
    margin:0 0 4px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .res-frac{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--muted);
    font-weight:400;
  }
  .res-list{margin-top:8px;}
  .empty-note{
    font-size:12.5px;
    color:var(--muted);
    font-style:italic;
    padding:6px 0;
  }
  .footer-actions{
    margin-top:40px;
    padding-top:16px;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
  }
  .footer-note{
    font-size:12px;
    color:var(--muted);
    max-width:560px;
  }
  .reset-btn{
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    background:none;
    border:1px solid var(--border);
    color:var(--muted);
    padding:7px 13px;
    border-radius:8px;
    cursor:pointer;
  }
  .reset-btn:hover{border-color:#a3402f;color:#a3402f;}
  .loading{
    padding:40px;text-align:center;color:var(--muted);font-size:14px;
  }
  @media (max-width:520px){
    header.banner h1{font-size:19px;}
    header.banner img{width:52px;height:52px;}
  }
</style>
</head>

let state = null;
let openStages = {};
let openAttach = {};

function uid(){ return Math.random().toString(36).slice(2,9); }

function newTask(text){
  return { id:uid(), text, done:false, attachments:[] };
}

function defaultState(){
  const schools = {};
  SCHOOLS.forEach(s=>{
    schools[s.id] = {};
    STAGE_DEFS.forEach(st=>{
      schools[s.id][st.id] = st.tasks.map(t=>newTask(t));
    });
  });
  const general = {};
  GENERAL_DEFS.forEach(g=>{
    general[g.id] = g.tasks.map(t=>newTask(t));
  });
  return { schools, general };
}

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value){
      return JSON.parse(res.value);
    }
    return null;
  }catch(e){
    return null;
  }
}

async function saveState(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), true);
  }catch(e){
    console.error("No se pudo guardar el tablero", e);
  }
}

function findSchoolTask(schoolId, stageId, text){
  const list = state.schools[schoolId][stageId] || [];
  return list.find(t=>t.text===text);
}

function pctOf(tasks){
  if(!tasks || !tasks.length) return 0;
  const done = tasks.filter(t=>t.done).length;
  return Math.round((done/tasks.length)*100);
}

function schoolStageDot(pct){
  if(pct >= 100) return "done";
  if(pct > 0) return "partial";
  return "";
}

function gaugeSVG(pct, size){
  size = size || 64;
  const cx = size/2, cy = size/2 + size*0.06, r = size*0.42;
  const rad = a => (a*Math.PI)/180;
  const angle = 180 - (pct/100)*180;
  const needleLen = r*0.82;
  const nx = cx + needleLen*Math.cos(rad(angle));
  const ny = cy - needleLen*Math.sin(rad(angle));
  const arcColor = pct >= 100 ? "#4C8062" : (pct > 0 ? "#F0B93E" : "#D6E4F0");
  const endX = cx + r*Math.cos(rad(180-(pct/100)*180));
  const endY = cy - r*Math.sin(rad(180-(pct/100)*180));
  const ticks = [];
  for(let i=0;i<=8;i++){
    const a = 180 - i*(180/8);
    const x1 = cx + r*0.98*Math.cos(rad(a));
    const y1 = cy - r*0.98*Math.sin(rad(a));
    const x2 = cx + r*0.86*Math.cos(rad(a));
    const y2 = cy - r*0.86*Math.sin(rad(a));
    ticks.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#D6E4F0" stroke-width="1.5"/>`);
  }
  return `
  <svg width="${size}" height="${size*0.62}" viewBox="0 0 ${size} ${size*0.62}" aria-hidden="true">
    <path d="M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}" fill="none" stroke="#D6E4F0" stroke-width="6" stroke-linecap="round"/>
    <path d="M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${endX.toFixed(1)} ${endY.toFixed(1)}" fill="none" stroke="${arcColor}" stroke-width="6" stroke-linecap="round"/>
    ${ticks.join("")}
    <circle cx="${cx}" cy="${cy}" r="3" fill="${arcColor}"/>
    <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="${arcColor}" stroke-width="2" stroke-linecap="round"/>
  </svg>`;
}

function attachBlockHTML(task, path, isOpen){
  if(!isOpen) return "";
  const chips = (task.attachments||[]).map(a=>`
    <a class="attach-chip" href="${a.url}" target="_blank" rel="noopener">
      ${a.label || "Archivo"}
      <button type="button" data-delattach="${path}:${task.id}:${a.id}" aria-label="Quitar">&#10005;</button>
    </a>`).join("");
  return `<div class="attach-block">
    <div class="attach-list">${chips || '<span class="empty-note" style="padding:0;">Sin archivos adjuntos.</span>'}</div>
    <div class="attach-form">
      <input type="text" class="name" placeholder="Nombre (ej. Foto instalación)" data-attachname="${path}:${task.id}">
      <input type="text" class="link" placeholder="Enlace (Google Drive, etc.)" data-attachlink="${path}:${task.id}">
      <button type="button" data-attachbtn="${path}:${task.id}">Adjuntar</button>
    </div>
  </div>`;
}

function taskRowHTML(t, scope, a, b, attachable){
  const path = scope==="school" ? `school:${a}:${b}` : `general:${a}`;
  const rowKey = path+":"+t.id;
  const nAttach = (t.attachments||[]).length;
  return `<div class="task-row ${t.done?'done':''}">
    <input type="checkbox" ${t.done?'checked':''} data-check="${path}:${t.id}">
    <div class="task-main">
      <label data-check-label="${path}:${t.id}">${t.text}</label>
      ${attachable ? `<div class="task-meta-row">
        <button type="button" class="attach-toggle" data-toggleattach="${rowKey}">${nAttach ? nAttach+' archivo'+(nAttach>1?'s':'') : '+ adjuntar archivo'}</button>
      </div>` : ""}
      ${attachable ? attachBlockHTML(t, path, !!openAttach[rowKey]) : ""}
    </div>
    <span class="task-actions">
      <button class="task-del" data-del="${path}:${t.id}" aria-label="Eliminar tarea">&#10005;</button>
    </span>
  </div>`;
}

function getList(pathParts){
  if(pathParts[0]==="school"){
    return state.schools[pathParts[1]][pathParts[2]];
  }
  return state.general[pathParts[1]];
}

function render(){
  const app = document.getElementById("app");
  let html = "";

  html += `
  <header class="banner">
    <img src="${LOGO_SRC}" alt="FCAG-UNLP">
    <h1>Cómo está <span class="accent">el tiempo</span> en tu escuela</h1>
  </header>`;

  html += `<div class="wrap">`;

  html += `<p class="credit-line">Proyecto financiado a través del Consejo Hídrico Federal (COHIFE), en articulación con la Dirección de Monitoreo Hídrico de la Subsecretaría de Recursos Hídricos, Ministerio de Infraestructura y Servicios Públicos de la Provincia de Buenos Aires.</p>`;

  html += `<div class="section-title">Escuelas</div>`;
  html += `<div class="schools-grid">`;
  SCHOOLS.forEach(s=>{
    const schoolTasks = [];
    STAGE_DEFS.forEach(st=> (state.schools[s.id][st.id]||[]).forEach(t=>schoolTasks.push(t)));
    const schoolPct = pctOf(schoolTasks);

    html += `<div class="school-card">
      <div class="school-head">
        ${gaugeSVG(schoolPct, 52)}
        <div class="school-info">
          <p class="school-name">${s.name}</p>
          <p class="school-loc">${s.loc}</p>
        </div>
      </div>`;

    STAGE_DEFS.forEach(st=>{
      const tasks = state.schools[s.id][st.id]||[];
      const p = pctOf(tasks);
      const done = tasks.filter(t=>t.done).length;
      const key = s.id+"__"+st.id;
      const isOpen = !!openStages[key];
      html += `<div class="stage">
        <div class="stage-head" data-toggle="${key}">
          <div class="stage-head-left">
            <span class="stage-dot ${schoolStageDot(p)}"></span>
            <span class="stage-title">${st.label}</span>
          </div>
          <span class="stage-frac">${done}/${tasks.length}</span>
          <span class="chev ${isOpen?'open':''}">&#9656;</span>
        </div>
        <div class="stage-body ${isOpen?'open':''}">
          ${tasks.map(t=>taskRowHTML(t, "school", s.id, st.id, false)).join("")}

            <input type="text" placeholder="Agregar tarea…" data-addinput="school:${s.id}:${st.id}">
            <button data-addbtn="school:${s.id}:${st.id}">Agregar</button>
          </div>
        </div>
      </div>`;
    });

    html += `</div>`;
  });
  html += `</div>`;

  html += `<div class="section-title">Estado de instalación</div>`;
  html += `<div class="section-sub">Vista rápida del instrumental instalado en cada escuela. Se sincroniza con la 2ª visita de cada una.</div>`;
  html += `<div class="install-panel">`;
  SCHOOLS.forEach(s=>{
    const ema = findSchoolTask(s.id, "visita2", "Instalación de la EMA");
    const pluvio = findSchoolTask(s.id, "visita2", "Instalación del pluviómetro");
    html += `<div class="install-row">
      <div class="install-name">${s.name}<span>${s.loc}</span></div>
      <label class="install-check ${ema && ema.done ? 'done':''}">
        <input type="checkbox" ${ema && ema.done ? 'checked':''} data-check="school:${s.id}:visita2:${ema?ema.id:''}"> EMA instalada
      </label>
      <label class="install-check ${pluvio && pluvio.done ? 'done':''}">
        <input type="checkbox" ${pluvio && pluvio.done ? 'checked':''} data-check="school:${s.id}:visita2:${pluvio?pluvio.id:''}"> Pluviómetro instalado
      </label>
    </div>`;
  });
  html += `</div>`;

  html += `<div class="section-title">Recursos y materiales de gestión general</div>`;
  html += `<div class="resources-grid">`;
  GENERAL_DEFS.forEach(g=>{
    const tasks = state.general[g.id]||[];
    const done = tasks.filter(t=>t.done).length;
    html += `<div class="res-card">
      <p class="res-title">${g.label} <span class="res-frac">${done}/${tasks.length}</span></p>
      <div class="res-list">
        ${tasks.length ? tasks.map(t=>taskRowHTML(t,"general",g.id,null,g.attachable)).join("") : '<div class="empty-note">Sin tareas todavía.</div>'}
      </div>
      <div class="add-row">
        <input type="text" placeholder="Agregar tarea…" data-addinput="general:${g.id}">
        <button data-addbtn="general:${g.id}">Agregar</button>
      </div>
    </div>`;
  });
  html += `</div>`;

  html += `<div class="footer-actions">
    <p class="footer-note">El progreso, las asignaciones y los enlaces se guardan automáticamente en tu cuenta de Claude. Los adjuntos son enlaces (por ejemplo a Google Drive), no archivos subidos.</p>
    <button class="reset-btn" id="reset-btn">Reiniciar tablero</button>
  </div>`;

  html += `</div>`;

  app.innerHTML = html;
  wireEvents();
}

function wireEvents(){
  document.querySelectorAll("[data-toggle]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const key = el.getAttribute("data-toggle");
      openStages[key] = !openStages[key];
      render();
    });
  });

  document.querySelectorAll("[data-check]").forEach(el=>{
    el.addEventListener("change", ()=>{
      const raw = el.getAttribute("data-check");
      const parts = raw.split(":");
      const taskId = parts.pop();
      if(!taskId) return;
      const list = getList(parts);
      const task = list.find(t=>t.id===taskId);
      if(task){ task.done = el.checked; }
      saveState();
      render();
    });
  });

  document.querySelectorAll("[data-del]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const parts = el.getAttribute("data-del").split(":");
      const taskId = parts.pop();
      const list = getList(parts);
      const idx = list.findIndex(t=>t.id===taskId);
      if(idx>-1) list.splice(idx,1);
      saveState();
      render();
    });
  });

  document.querySelectorAll("[data-toggleattach]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const key = el.getAttribute("data-toggleattach");
      openAttach[key] = !openAttach[key];
      render();
    });
  });

  document.querySelectorAll("[data-attachbtn]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const key = el.getAttribute("data-attachbtn");
      const nameInput = document.querySelector(`[data-attachname="${key}"]`);
      const linkInput = document.querySelector(`[data-attachlink="${key}"]`);
      const url = linkInput.value.trim();
      if(!url) return;
      const parts = key.split(":");
      const taskId = parts.pop();
      const list = getList(parts);
      const task = list.find(t=>t.id===taskId);
      if(task){
        task.attachments = task.attachments || [];
        task.attachments.push({ id:uid(), label:nameInput.value.trim() || "Archivo", url });
      }
      saveState();
      render();
    });
  });

  document.querySelectorAll("[data-delattach]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const parts = el.getAttribute("data-delattach").split(":");
      const attachId = parts.pop();
      const taskId = parts.pop();
      const list = getList(parts);
      const task = list.find(t=>t.id===taskId);
      if(task && task.attachments){
        const idx = task.attachments.findIndex(a=>a.id===attachId);
        if(idx>-1) task.attachments.splice(idx,1);
      }
      saveState();
      render();
    });
  });

  document.querySelectorAll("[data-addbtn]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const key = el.getAttribute("data-addbtn");
      const input = document.querySelector(`[data-addinput="${key}"]`);
      const val = input.value.trim();
      if(!val) return;
      const parts = key.split(":");
      const list = getList(parts);
      list.push(newTask(val));
      if(parts[0]==="school"){
        openStages[parts[1]+"__"+parts[2]] = true;
      }
      saveState();
      render();
    });
  });

  document.querySelectorAll("[data-addinput]").forEach(el=>{
    el.addEventListener("keydown", (e)=>{
      if(e.key==="Enter"){
        const key = el.getAttribute("data-addinput");
        document.querySelector(`[data-addbtn="${key}"]`).click();
      }
    });
  });

  const resetBtn = document.getElementById("reset-btn");
  if(resetBtn){
    resetBtn.addEventListener("click", async ()=>{
      if(confirm("Esto borra el progreso guardado y vuelve al tablero inicial. ¿Continuar?")){
        state = defaultState();
        openStages = {};
        openAttach = {};
        await saveState();
        render();
      }
    });
  }
}

(async function init(){
  const loaded = await loadState();
  state = loaded || defaultState();
  if(!loaded){ await saveState(); }
  render();
})();
</script>
</body>
</html>
